[package]
name = "task-management"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"]}
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.4"
sha2 = "0.11.1"

redis = {
	version = "2.0.0-rc.3",
	features = ["tokio-comp", "tls-rustls", "tls-rustls-native-roots"]
}
serde_json = "1.0.154"
async-trait = "0.1.92"
sqlx = { version = "0.9.1", features = ["postgres", "tls-rustls", "derive", "chrono", "runtime-tokio"] }
argon2 = "0.6.0"
password-hash = "0.6.1"
rand_core = "0.6.4"