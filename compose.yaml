services:
  postgres:
    image: postgres:18-alpine
    container_name: tm_pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tm
    ports:
      - "5432:5432"
    volumes:
      - tm_pgdata:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  tm_pgdata:
  redis-data: